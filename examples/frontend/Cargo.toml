[package]
name = "jsonapi-showcase-frontend"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# used by the client, inspector, and pages tasks (added ahead of first use)
jsonapi_core = { path = "../../jsonapi_core", version = "0.4.0", features = ["atomic-ops"] }
jsonapi-showcase-resources = { path = "../resources", version = "0.1.0" }

leptos = { version = "0.8", features = ["csr"] }
leptos_router = { version = "0.8" }
gloo-net = { version = "0.6", features = ["http"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window"] }
console_error_panic_hook = "0.1"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[lints]
workspace = true
