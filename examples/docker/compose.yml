services:
  backend:
    build:
      context: ../..
      dockerfile: examples/docker/backend.Dockerfile
    environment:
      APP_BIND: 0.0.0.0:8080
      APP_BASE_URL: http://localhost:8080
      APP_CORS_ORIGINS: http://localhost:8081
      DATABASE_URL: sqlite:///data/showcase.db?mode=rwc
    volumes:
      - backend-data:/data
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ../..
      dockerfile: examples/docker/frontend.Dockerfile
      args:
        API_BASE: http://localhost:8080
    ports:
      - "8081:80"
    depends_on:
      - backend

volumes:
  backend-data:
