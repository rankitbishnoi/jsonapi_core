[package]
name = "jsonapi-showcase-backend"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
jsonapi_core = { path = "../../jsonapi_core", version = "0.4.0", features = ["atomic-ops"] }
jsonapi_axum = { path = "../../jsonapi_axum", version = "0.4.0", features = ["sqlx", "uuid", "validator", "anyhow"] }

axum = { version = "0.8", features = ["tokio", "http1", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }

sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
validator = { version = "0.20", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"

[dev-dependencies]
jsonapi_axum = { path = "../../jsonapi_axum", version = "0.4.0", features = ["sqlx", "uuid", "validator", "anyhow", "testing"] }

[lints]
workspace = true
