name: Bug report
description: Report incorrect or unexpected behaviour in a jsonapi_core crate
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Please fill out the sections
        below so we can reproduce and diagnose the issue quickly.
  - type: dropdown
    id: crate
    attributes:
      label: Affected crate
      description: Which crate is this about?
      options:
        - jsonapi_core
        - jsonapi_core_derive
        - jsonapi_core_validation
        - jsonapi_http
        - jsonapi_axum
        - not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Crate version
      description: The version of the affected crate (e.g. 0.4.0).
      placeholder: "0.4.0"
    validations:
      required: true
  - type: input
    id: rustc
    attributes:
      label: Rust version
      description: Output of `rustc --version`.
      placeholder: "rustc 1.94.1"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, including the actual behaviour.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: >
        A minimal code snippet or steps that reproduce the issue. Include the
        JSON:API document involved if relevant.
      render: rust
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Backtraces, logs, or anything else that might help.
    validations:
      required: false
