name: Feature request
description: Suggest a new capability or improvement
labels: ["enhancement"]
body:
  - type: dropdown
    id: crate
    attributes:
      label: Target crate
      description: Which crate would this affect?
      options:
        - jsonapi_core
        - jsonapi_core_derive
        - jsonapi_core_validation
        - jsonapi_http
        - jsonapi_axum
        - new crate / unsure
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem are you trying to solve? What is missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: >
        Describe the API or behaviour you would like. Reference the relevant
        part of the JSON:API v1.1 spec if applicable.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you evaluated and why they fall short.
    validations:
      required: false
