name: docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege; deploy-pages needs `pages: write` + the OIDC `id-token`.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deploy; don't cancel an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  MDBOOK_VERSION: "0.5.4"
  MDBOOK_LINKCHECK_VERSION: "0.7.7"

jobs:
  # Build + link-check on every push and PR (gates the guide the way `cargo doc`
  # gates rustdoc). Only `main` pushes go on to deploy.
  build:
    name: build & linkcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install mdbook + mdbook-linkcheck
        run: |
          cargo install mdbook --version "${MDBOOK_VERSION}" --locked
          cargo install mdbook-linkcheck --version "${MDBOOK_LINKCHECK_VERSION}" --locked
      # Standalone link check: fails on broken cross-links / missing files.
      # (The `[`Type`]` inline references render as text and are non-fatal warnings.)
      - name: Check links
        run: mdbook-linkcheck --standalone docs
      - name: Build book
        run: mdbook build docs
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs/book

  # Publish to GitHub Pages — only on a push to `main`.
  deploy:
    name: deploy
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
