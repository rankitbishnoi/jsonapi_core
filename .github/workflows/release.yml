name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - name: Check tag matches workspace version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          WS_VERSION=$(cargo metadata --format-version 1 --no-deps \
            | python3 -c "import json,sys; m=json.load(sys.stdin); \
              v=next(p['version'] for p in m['packages'] if p['name']=='jsonapi_core'); print(v)")
          echo "tag=$TAG workspace=$WS_VERSION"
          if [ "$TAG" != "$WS_VERSION" ]; then
            echo "::error::Tag $TAG does not match jsonapi_core version $WS_VERSION"
            exit 1
          fi
          # All publishable crates inherit the workspace version; guard against a
          # future crate re-pinning its own version and drifting from the tag.
          for crate in jsonapi_core_validation jsonapi_core_derive jsonapi_http jsonapi_axum; do
            V=$(cargo metadata --format-version 1 --no-deps \
              | python3 -c "import json,sys; m=json.load(sys.stdin); \
                v=next(p['version'] for p in m['packages'] if p['name']=='$crate'); print(v)")
            if [ "$V" != "$TAG" ]; then
              echo "::error::$crate is $V, expected $TAG"
              exit 1
            fi
          done
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - run: cargo test -p jsonapi_core --no-default-features
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit dependencies for known advisories
        run: cargo audit --deny warnings
      - name: SemVer compliance (jsonapi_core)
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2
      - name: Build docs (deny warnings)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps --all-features
      # All publishable crates package cleanly. `--no-verify` (tarball only, no
      # isolated verify build) is required because this release first-publishes
      # workspace members (jsonapi_core_validation, jsonapi_http, jsonapi_axum)
      # that other members depend on — a per-crate `cargo package` would try to
      # resolve those siblings from the registry, where they don't exist yet.
      # `--workspace` packages them together and resolves siblings locally; the
      # ordered `cargo publish` below does the real build-verify at publish time,
      # once each crate's dependencies are on the index. `acceptance` is
      # `publish = false` and is skipped automatically.
      - name: Verify all crates package cleanly
        run: cargo package --workspace --no-verify --exclude acceptance

  msrv:
    name: msrv (1.94.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # master
        with:
          toolchain: "1.94.1"
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          key: msrv
      - run: cargo build --workspace --all-features
      - run: cargo test --workspace --all-features

  publish-crates:
    name: publish to crates.io
    needs: [verify, msrv]
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      - name: Publish jsonapi_core_validation
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p jsonapi_core_validation

      - name: Wait for jsonapi_core_validation to appear on the index
        run: |
          VERSION=$(cargo metadata --format-version 1 --no-deps \
            | python3 -c "import json,sys; m=json.load(sys.stdin); \
              v=next(p['version'] for p in m['packages'] if p['name']=='jsonapi_core_validation'); print(v)")
          UA="jsonapi_core-release-workflow (https://github.com/rankitbishnoi/jsonapi_core)"
          for i in $(seq 1 30); do
            if curl -fsSL -H "User-Agent: $UA" \
                "https://crates.io/api/v1/crates/jsonapi_core_validation" \
                | jq -e --arg v "$VERSION" '.versions[] | select(.num == $v)' >/dev/null; then
              echo "jsonapi_core_validation $VERSION is available"
              break
            fi
            echo "waiting for jsonapi_core_validation $VERSION ($i/30)..."
            sleep 10
            if [ "$i" -eq 30 ]; then
              echo "::error::Timed out waiting for jsonapi_core_validation on the registry"
              exit 1
            fi
          done

      - name: Publish jsonapi_core_derive
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p jsonapi_core_derive

      - name: Wait for jsonapi_core_derive to appear on the index
        run: |
          VERSION=$(cargo metadata --format-version 1 --no-deps \
            | python3 -c "import json,sys; m=json.load(sys.stdin); \
              v=next(p['version'] for p in m['packages'] if p['name']=='jsonapi_core_derive'); print(v)")
          UA="jsonapi_core-release-workflow (https://github.com/rankitbishnoi/jsonapi_core)"
          for i in $(seq 1 30); do
            if curl -fsSL -H "User-Agent: $UA" \
                "https://crates.io/api/v1/crates/jsonapi_core_derive" \
                | jq -e --arg v "$VERSION" '.versions[] | select(.num == $v)' >/dev/null; then
              echo "jsonapi_core_derive $VERSION is available"
              exit 0
            fi
            echo "waiting for jsonapi_core_derive $VERSION ($i/30)..."
            sleep 10
          done
          echo "::error::Timed out waiting for jsonapi_core_derive on the registry"
          exit 1

      - name: Publish jsonapi_core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p jsonapi_core

      - name: Wait for jsonapi_core to appear on the index
        run: |
          VERSION=$(cargo metadata --format-version 1 --no-deps \
            | python3 -c "import json,sys; m=json.load(sys.stdin); \
              v=next(p['version'] for p in m['packages'] if p['name']=='jsonapi_core'); print(v)")
          UA="jsonapi_core-release-workflow (https://github.com/rankitbishnoi/jsonapi_core)"
          for i in $(seq 1 30); do
            if curl -fsSL -H "User-Agent: $UA" \
                "https://crates.io/api/v1/crates/jsonapi_core" \
                | jq -e --arg v "$VERSION" '.versions[] | select(.num == $v)' >/dev/null; then
              echo "jsonapi_core $VERSION is available"
              break
            fi
            echo "waiting for jsonapi_core $VERSION ($i/30)..."
            sleep 10
            if [ "$i" -eq 30 ]; then
              echo "::error::Timed out waiting for jsonapi_core on the registry"
              exit 1
            fi
          done

      - name: Publish jsonapi_http
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p jsonapi_http

      - name: Wait for jsonapi_http to appear on the index
        run: |
          VERSION=$(cargo metadata --format-version 1 --no-deps \
            | python3 -c "import json,sys; m=json.load(sys.stdin); \
              v=next(p['version'] for p in m['packages'] if p['name']=='jsonapi_http'); print(v)")
          UA="jsonapi_core-release-workflow (https://github.com/rankitbishnoi/jsonapi_core)"
          for i in $(seq 1 30); do
            if curl -fsSL -H "User-Agent: $UA" \
                "https://crates.io/api/v1/crates/jsonapi_http" \
                | jq -e --arg v "$VERSION" '.versions[] | select(.num == $v)' >/dev/null; then
              echo "jsonapi_http $VERSION is available"
              break
            fi
            echo "waiting for jsonapi_http $VERSION ($i/30)..."
            sleep 10
            if [ "$i" -eq 30 ]; then
              echo "::error::Timed out waiting for jsonapi_http on the registry"
              exit 1
            fi
          done

      - name: Publish jsonapi_axum
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p jsonapi_axum

      - name: Package crates for provenance attestation
        run: cargo package --workspace --no-verify --exclude acceptance

      - name: Attest crate provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'target/package/*.crate'

  github-release:
    name: GitHub release
    needs: publish-crates
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Extract release notes from CHANGELOG
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$TAG_VERSION" '
            $0 ~ "^## \\[" ver "\\]" { in_section = 1; print; next }
            in_section && /^## \[/ { exit }
            in_section { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::warning::No CHANGELOG section [$TAG_VERSION]; falling back to auto-generated notes only. Did you rename [Unreleased] → [$TAG_VERSION] before tagging?"
          else
            echo "::notice::Curated release notes extracted from CHANGELOG.md [$TAG_VERSION]"
          fi
      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: release-notes.md
          generate_release_notes: true
          append_body: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
