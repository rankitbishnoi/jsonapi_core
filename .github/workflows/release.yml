name: Release

on:
  push:
    tags:
      # Two independently versioned release lines:
      #   v<ver>       -> jsonapi_core_validation, jsonapi_core_derive, jsonapi_core (1.x)
      #   http-v<ver>  -> jsonapi_http, jsonapi_axum (0.x)
      - 'v*'
      - 'http-v*'

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    outputs:
      line: ${{ steps.line.outputs.line }}
      crates: ${{ steps.line.outputs.crates }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
      - name: Resolve release line from tag
        id: line
        run: |
          case "$GITHUB_REF_NAME" in
            http-v*)
              echo "line=http" >> "$GITHUB_OUTPUT"
              echo "version=${GITHUB_REF_NAME#http-v}" >> "$GITHUB_OUTPUT"
              echo "crates=jsonapi_http jsonapi_axum" >> "$GITHUB_OUTPUT"
              ;;
            v*)
              echo "line=core" >> "$GITHUB_OUTPUT"
              echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
              echo "crates=jsonapi_core_validation jsonapi_core_derive jsonapi_core" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Unrecognised release tag $GITHUB_REF_NAME"
              exit 1
              ;;
          esac
      - name: Check tag matches the release line's crate versions
        env:
          VERSION: ${{ steps.line.outputs.version }}
          CRATES: ${{ steps.line.outputs.crates }}
        run: |
          for crate in $CRATES; do
            V=$(cargo metadata --format-version 1 --no-deps \
              | python3 -c "import json,sys; m=json.load(sys.stdin); \
                v=next(p['version'] for p in m['packages'] if p['name']=='$crate'); print(v)")
            echo "$crate=$V tag=$VERSION"
            if [ "$V" != "$VERSION" ]; then
              echo "::error::$crate is $V, expected $VERSION"
              exit 1
            fi
          done
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - run: cargo test -p jsonapi_core --no-default-features
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit dependencies for known advisories
        run: cargo audit --deny warnings
      # The first release of each line is skipped on purpose:
      #   v1.0.0      - intentionally removes CursorLinks::build and the public
      #                 From<jsonapi_core_validation::MemberNameKind> impl vs 1.0.0-rc.2.
      #   http-v0.4.0 - the crates.io baseline (1.0.0-rc.2) is *higher* than 0.4.0,
      #                 so there is nothing meaningful to diff against.
      # Every later tag on either line is checked normally.
      - name: SemVer compliance (core line)
        if: steps.line.outputs.line == 'core' && github.ref_name != 'v1.0.0'
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2
        with:
          # jsonapi_core_validation is deliberately excluded: it is not covered by
          # SemVer (core pins it with `=`), so its API may change in any release.
          package: jsonapi_core, jsonapi_core_derive
      - name: SemVer compliance (http line)
        if: steps.line.outputs.line == 'http' && github.ref_name != 'http-v0.4.0'
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2
        with:
          package: jsonapi_http, jsonapi_axum
      - name: Build docs (deny warnings)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps --all-features
      # All publishable crates package cleanly. `--no-verify` (tarball only, no
      # isolated verify build) is required because this release first-publishes
      # workspace members (jsonapi_core_validation, jsonapi_http, jsonapi_axum)
      # that other members depend on — a per-crate `cargo package` would try to
      # resolve those siblings from the registry, where they don't exist yet.
      # `--workspace` packages them together and resolves siblings locally; the
      # ordered `cargo publish` below does the real build-verify at publish time,
      # once each crate's dependencies are on the index. `acceptance` is
      # `publish = false` and is skipped automatically.
      - name: Verify all crates package cleanly
        run: cargo package --workspace --no-verify --exclude acceptance

  msrv:
    name: msrv (1.94.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # master
        with:
          toolchain: "1.94.1"
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          key: msrv
      - run: cargo build --workspace --all-features
      - run: cargo test --workspace --all-features

  publish-crates:
    name: publish to crates.io
    needs: [verify, msrv]
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2

      # Publish the line's crates in dependency order, waiting for each to be
      # visible on the index before the next one (which may depend on it).
      - name: Publish ${{ needs.verify.outputs.line }} line
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          CRATES: ${{ needs.verify.outputs.crates }}
        run: |
          UA="jsonapi_core-release-workflow (https://github.com/rankitbishnoi/jsonapi_core)"
          for crate in $CRATES; do
            cargo publish -p "$crate"
            VERSION=$(cargo metadata --format-version 1 --no-deps \
              | python3 -c "import json,sys; m=json.load(sys.stdin); \
                v=next(p['version'] for p in m['packages'] if p['name']=='$crate'); print(v)")
            for i in $(seq 1 30); do
              if curl -fsSL -H "User-Agent: $UA" \
                  "https://crates.io/api/v1/crates/$crate" \
                  | jq -e --arg v "$VERSION" '.versions[] | select(.num == $v)' >/dev/null; then
                echo "$crate $VERSION is available"
                break
              fi
              echo "waiting for $crate $VERSION ($i/30)..."
              sleep 10
              if [ "$i" -eq 30 ]; then
                echo "::error::Timed out waiting for $crate on the registry"
                exit 1
              fi
            done
          done

      - name: Package crates for provenance attestation
        env:
          CRATES: ${{ needs.verify.outputs.crates }}
        run: |
          ARGS=""
          for crate in $CRATES; do ARGS="$ARGS -p $crate"; done
          cargo package --no-verify $ARGS

      - name: Attest crate provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'target/package/*.crate'

  github-release:
    name: GitHub release
    needs: publish-crates
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          # CHANGELOG headings: `## [1.0.0]` for the core line,
          # `## [http-0.4.0]` for the http line.
          case "$GITHUB_REF_NAME" in
            http-v*) TAG_VERSION="http-${GITHUB_REF_NAME#http-v}" ;;
            *)       TAG_VERSION="${GITHUB_REF_NAME#v}" ;;
          esac
          # Bare semver (no `http-` prefix) drives the prerelease flag, so the
          # `-` in `http-v0.4.0` does not mark HTTP releases as prereleases.
          echo "version=${TAG_VERSION#http-}" >> "$GITHUB_OUTPUT"
          awk -v ver="$TAG_VERSION" '
            $0 ~ "^## \\[" ver "\\]" { in_section = 1; print; next }
            in_section && /^## \[/ { exit }
            in_section { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::warning::No CHANGELOG section [$TAG_VERSION]; falling back to auto-generated notes only. Did you rename [Unreleased] → [$TAG_VERSION] before tagging?"
          else
            echo "::notice::Curated release notes extracted from CHANGELOG.md [$TAG_VERSION]"
          fi
      - name: Create GitHub release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          body_path: release-notes.md
          generate_release_notes: true
          append_body: true
          draft: false
          prerelease: ${{ contains(steps.notes.outputs.version, '-') }}
          # Keep GitHub's "Latest release" on the core line; HTTP-line releases
          # should not take it over.
          make_latest: ${{ !startsWith(github.ref_name, 'http-v') }}
