name: examples

on:
  push:
    branches: [main]
    paths:
      - 'examples/**'
      - 'jsonapi_core/**'
      - 'jsonapi_core_derive/**'
      - 'jsonapi_core_validation/**'
      - 'jsonapi_http/**'
      - 'jsonapi_axum/**'
      - '.github/workflows/examples.yml'
  pull_request:
    branches: [main]
    paths:
      - 'examples/**'
      - 'jsonapi_core/**'
      - 'jsonapi_core_derive/**'
      - 'jsonapi_core_validation/**'
      - 'jsonapi_http/**'
      - 'jsonapi_axum/**'
      - '.github/workflows/examples.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt (examples)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    name: clippy (examples)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: examples -> examples/target
      - run: cargo clippy -p jsonapi-showcase-backend -p jsonapi-showcase-resources --all-targets -- -D warnings

  test:
    name: test (examples)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: examples -> examples/target
      - name: Test backend
        run: cargo test -p jsonapi-showcase-backend

  frontend:
    name: frontend build (examples)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: examples -> examples/target
      - name: Install trunk + wasm-bindgen
        run: cargo install trunk --locked wasm-bindgen-cli
      - name: Frontend unit tests (native)
        run: cargo test -p jsonapi-showcase-frontend --lib
      - name: Frontend wasm tests (node runner)
        run: cargo test -p jsonapi-showcase-frontend --target wasm32-unknown-unknown --test frontend_wasm
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
      - name: Trunk build
        run: cd frontend && trunk build
      - name: Clippy (wasm)
        run: cargo clippy -p jsonapi-showcase-frontend --target wasm32-unknown-unknown --all-targets -- -D warnings
